name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `make release` derives VERSION from git describe

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: build static binaries
        run: make release

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tsa-bench-linux-amd64
            dist/tsa-bench-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
